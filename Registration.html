
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Portal</title>
    <style>
        :root {
            --primary-bg:#ffffff ;
            --accent-color: rgba(219, 95, 200, 0.584);
            --accent-solid: rgb(219, 95, 200); /* Solid version for high-contrast text */
            --card-bg:rgb(1, 1, 74) ;
            /* --text-dark: #111122; */
            --text-muted: #666688;
            --border-color: #dddded;
        }
        a{
            text-decoration:none ;

        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-dark);
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid var(--accent-solid);
            padding-bottom: 20px;
        }

        .header h1 {
            color: var(--primary-bg);
            margin: 0 0 10px 0;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 15px;
        }

        .section-title {
            font-size: 16px;
            color: var(--primary-bg);
            background-color: var(--accent-color);
            margin-top: 35px;
            margin-bottom: 20px;
            padding: 8px 15px;
            border-radius: 4px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--primary-bg);
        }

        label .required {
            color: #d9534f;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            padding: 12px 14px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s ease-in-out;
            background-color: #fff;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-solid);
            box-shadow: 0 0 0 4px var(--accent-color);
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        .file-upload {
            padding: 12px;
            border: 2px dashed var(--accent-solid);
            background-color: rgba(219, 95, 200, 0.05);
            border-radius: 6px;
            cursor: pointer;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-top: 25px;
            padding: 15px;
            background-color: #f8f8fc;
            border-radius: 6px;
        }

        .checkbox-group input {
            margin-top: 4px;
            scale: 1.2;
        }

        .btn-submit {
            background-color: var(--primary-bg);
            color: white;
            border: 2px solid transparent;
            padding: 16px 28px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease-in-out;
        }

        .btn-submit:hover {
            background-color: white;
            color: var(--primary-bg);
            border-color: var(--primary-bg);
            box-shadow: 0 0 0 4px var(--accent-color);
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
            .container {
                padding: 25px 15px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Admissions Application Form</h1>
        <p>Please complete all required fields accurately to submit your enrollment request.</p>
    </div>

    <form action="#" method="POST" enctype="multipart/form-data">
        
        <!-- 1. STUDENT PERSONAL INFORMATION -->
        <div class="section-title">1. Student Personal Information</div>
        <div class="form-grid">
            <div class="form-group">
                <label for="first-name">First Name <span class="required">*</span></label>
                <input type="text" id="first-name" name="first_name" required>
            </div>
            <div class="form-group">
                <label for="last-name">Last Name <span class="required">*</span></label>
                <input type="text" id="last-name" name="last_name" required>
            </div>
            <div class="form-group">
                <label for="dob">Date of Birth <span class="required">*</span></label>
                <input type="date" id="dob" name="dob" required>
            </div>
            <div class="form-group">
                <label for="gender">Gender <span class="required">*</span></label>
                <select id="gender" name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>
            <div class="form-group">
                <label for="nationality">Nationality <span class="required">*</span></label>
                <input type="text" id="nationality" name="nationality" required>
            </div>
            <div class="form-group">
                <label for="national-id">National ID / Passport No.</label>
                <input type="text" id="national-id" name="national_id">
            </div>
            <div class="form-group full-width">
                <label for="address">Residential Address <span class="required">*</span></label>
                <input type="text" id="address" name="address" required>
            </div>
        </div>

        <!-- 2. PARENT / GUARDIAN DETAILS -->
        <div class="section-title">2. Parent / Legal Guardian Details</div>
        <div class="form-grid">
            <div class="form-group">
                <label for="guardian-name">Guardian Full Name <span class="required">*</span></label>
                <input type="text" id="guardian-name" name="guardian_name" required>
            </div>
            <div class="form-group">
                <label for="relationship">Relationship to Student <span class="required">*</span></label>
                <select id="relationship" name="relationship" required>
                    <option value="">Select Relationship</option>
                    <option value="father">Father</option>
                    <option value="mother">Mother</option>
                    <option value="guardian">Legal Guardian</option>
                </select>
            </div>
            <div class="form-group">
                <label for="email">Email Address <span class="required">*</span></label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number <span class="required">*</span></label>
                <input type="tel" id="phone" name="phone" placeholder="+250..." required>
            </div>
        </div>

        <!-- 3. ACADEMIC BACKGROUND -->
        <div class="section-title">3. Academic Background</div>
        <div class="form-grid">
            <div class="form-group">
                <label for="current-school">Current School Name <span class="required">*</span></label>
                <input type="text" id="current-school" name="current_school" required>
            </div>
            <div class="form-group">
                <label for="target-grade">Applying for Grade/Form Level <span class="required">*</span></label>
                <select id="target-grade" name="target_grade" required>
                    <option value="">Select Grade</option>
                    <option value="grade7">Grade 7 / S1</option>
                    <option value="grade10">Grade 10 / S4</option>
                </select>
            </div>
        </div>

        <!-- 4. TALENT & MOTIVATION -->
        <div class="section-title">4. Personal Statement & STEM Interest</div>
        <div class="form-grid">
            <div class="form-group full-width">
                <label for="motivation">Why do you wish to join our academy? (Short Statement) <span class="required">*</span></label>
                <textarea id="motivation" name="motivation" placeholder="Share your passions, STEM interests, and academic goals..." required></textarea>
            </div>
        </div>

        <!-- 5. DOCUMENT UPLOADS -->
        <div class="section-title">5. Required Document Uploads</div>
        <div class="form-grid">
            <div class="form-group">
                <label for="doc-id">Birth Certificate or Passport (PDF/Image) <span class="required">*</span></label>
                <input type="file" id="doc-id" name="doc_id" class="file-upload" required>
            </div>
            <div class="form-group">
                <label for="doc-reports">Latest Academic Transcripts / Report Cards <span class="required">*</span></label>
                <input type="file" id="doc-reports" name="doc_reports" class="file-upload" required>
            </div>
        </div>

        <!-- 6. DECLARATION -->
        <div class="checkbox-group">
            <input type="checkbox" id="consent" name="consent" required>
            <label for="consent">I hereby certify that all information provided in this registration form is accurate, complete, and legally true to the best of my knowledge. <span class="required">*</span></label>
        </div>

        <button type="submit" class="btn-submit"><a href="pay.html">Submit Registration Application</a></button>
    </form>
</div>

</body>
</html>
